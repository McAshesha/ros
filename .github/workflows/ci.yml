name: ROS checks

on: [push, pull_request]

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w05-bca214e3de6f.tar.gz
  COURSE_KIT_SHA256: bca214e3de6f90f9513049dfa0f36fee65ad834da502dc3f3f8fb443517b5197

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:lyrical-desktop-full@sha256:12f03ad224f4f7801c4eeb320934b198fe0b9536d70f2f617894da08ca3bedba
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate environment JSON
        shell: bash
        run: python3 -m json.tool evidence/pr01/environment.json > /dev/null
      - name: Build and test
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y
          colcon build --symlink-install
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
          python3 -m pytest src/patrol/test -p no:cacheprovider
          python3 -m pytest src/course_bringup/test -p no:cacheprovider
          test -f "$(ros2 pkg prefix course_bringup)/share/course_bringup/launch/patrol.launch.py"
          ros2 launch course_bringup patrol.launch.py --show-args
      - name: Download course kit
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          curl -fsSL --retry 5 --retry-all-errors -o course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit
          rm course-kit.tar.gz
      - name: Check PR evidence
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 .course-kit/v1/tools/check_practice.py PR05 --submission .
